<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Price Visualizer</title>
    
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; background-color: #f8f9fa; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #2c3e50; margin-bottom: 20px; text-align: center; }
        
        /* Top Row: Dropdown */
        .top-controls { margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; }
        label { font-weight: 600; color: #555; font-size: 16px; }
        
        select { 
            padding: 10px 15px; 
            font-size: 16px; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            min-width: 300px; 
            background: #fff;
            cursor: pointer;
        }
        select:hover { border-color: #aaa; }

        /* Bottom Row: Time Filters */
        .time-filters { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #ccc;
            background: white;
            color: #555;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .filter-btn:hover { background-color: #f0f0f0; border-color: #bbb; }
        
        /* Active State */
        .filter-btn.active {
            background-color: #3498db;
            color: white;
            border-color: #2980b9;
        }
        
        canvas { max-height: 500px; width: 100%; }
        
        .status { text-align: center; color: #777; margin-top: 15px; font-style: italic; height: 20px; }
        .loading { color: #d35400; }
        .success { color: #27ae60; font-weight: bold; }
        .error { color: #c0392b; }
    </style>
</head>
<body>

<div class="container">
    <h1>Magic: The Gathering Price Tracker</h1>
    
    <!-- Row 1: Card Selection -->
    <div class="top-controls">
        <label for="cardSelect">Card:</label>
        <select id="cardSelect">
            <option value="">Loading data...</option>
        </select>
    </div>

    <!-- Row 2: Time Range Selection -->
    <div class="time-filters">
        <button class="filter-btn active" data-days="-1">All History</button>
        <button class="filter-btn" data-days="365">Past Year</button>
        <button class="filter-btn" data-days="30">Past Month</button>
        <button class="filter-btn" data-days="7">Past Week</button>
    </div>

    <canvas id="priceChart"></canvas>
    <div id="statusMsg" class="status loading">Initializing application...</div>
</div>

<script>
    // --- CONFIGURATION ---
    const CSV_FILE = 'data/price_history.csv';
    const JSON_FILE = 'data/dropdown_lookup.json';
    
    // State
    let allPriceData = [];
    let cardMetadata = {}; 
    let myChart = null;
    
    // Current State
    let currentFilterDays = -1; // -1 means All
    let currentSelectedId = null;
    let currentSelectedCondition = null;

    // DOM Elements
    const cardSelect = document.getElementById('cardSelect');
    const statusMsg = document.getElementById('statusMsg');
    const ctx = document.getElementById('priceChart').getContext('2d');
    const filterButtons = document.querySelectorAll('.filter-btn');

    // --- HELPER FUNCTIONS ---

    function getCondition(row) {
        const foil = String(row.foil).toLowerCase() === 'true';
        const etched = String(row.etched).toLowerCase() === 'true';
        if (etched) return 'Etched';
        if (foil) return 'Foil';
        return '';
    }

    function generateLabel(cardName, setName, condition) {
        const name = cardName || 'Unknown Card';
        const set = setName || 'Unknown Set';
        return `${name} -- ${set} -- ${condition}`;
    }

    // Date Filtering Logic
    function filterByDate(data, days) {
        if (days === -1) return data; // All history

        const now = new Date();
        // Reset time to midnight to compare dates cleanly
        now.setHours(0, 0, 0, 0);
        
        const cutoff = new Date(now);
        cutoff.setDate(cutoff.getDate() - days);

        return data.filter(row => {
            const rowDate = new Date(row.date);
            rowDate.setHours(0, 0, 0, 0); // Normalize comparison
            return rowDate >= cutoff;
        });
    }

    // --- CHART LOGIC ---

    function initChart() {
        if (myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Price ($)',
                    data: [],
                    borderColor: '#3498db',
                    backgroundColor: 'rgba(52, 152, 219, 0.1)',
                    borderWidth: 2.5,
                    fill: true,
                    tension: 0.3,
                    pointRadius: 3,
                    pointHoverRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            title: (items) => items[0].label,
                            label: (ctx) => `$${ctx.parsed.y.toFixed(2)}`
                        }
                    }
                },
                scales: {
                    x: {
                        type: 'category',
                        title: { display: true, text: 'Date' },
                        ticks: { maxTicksLimit: 12 }
                    },
                    y: {
                        beginAtZero: false,
                        title: { display: true, text: 'Price (USD)' },
                        ticks: { callback: v => '$' + v }
                    }
                }
            }
        });
    }

    function updateChart() {
        if (!currentSelectedId) {
            myChart.data.labels = [];
            myChart.data.datasets[0].data = [];
            myChart.update();
            return;
        }

        // 1. Filter by Condition (Foil/Etched/Regular)
        let filteredData = allPriceData.filter(row => {
            const rowCond = getCondition(row);
            return row.id.trim() === currentSelectedId && rowCond === currentSelectedCondition;
        });

        // 2. Filter by Time Period
        filteredData = filterByDate(filteredData, currentFilterDays);

        // 3. Sort Chronologically
        filteredData.sort((a, b) => new Date(a.date) - new Date(b.date));

        // 4. Update Chart Data
        myChart.data.labels = filteredData.map(d => d.date);
        myChart.data.datasets[0].data = filteredData.map(d => parseFloat(d.price));
        
        const meta = cardMetadata[currentSelectedId];
        const displayName = meta ? `${meta.name} (${meta.set_name})` : currentSelectedId;
        const periodLabel = currentFilterDays === -1 ? "All Time" : `Last ${currentFilterDays} Days`;
        
        myChart.data.datasets[0].label = `${displayName} - ${currentSelectedCondition} (${periodLabel})`;
        myChart.update();
    }

    // --- POPULATE DROPDOWN ---

    function populateDropdown() {
        const uniqueOptions = new Set();
        
        allPriceData.forEach(row => {
            const id = row.id.trim();
            const cond = getCondition(row);
            const comboKey = `${id}|${cond}`;
            
            if (!uniqueOptions.has(comboKey)) {
                uniqueOptions.add(comboKey);
                
                const meta = cardMetadata[id];
                const name = meta ? meta.name : id;
                const setName = meta ? meta.set_name : 'Unknown Set';
                
                const labelText = generateLabel(name, setName, cond);

                const option = document.createElement('option');
                option.value = id;
                option.textContent = labelText;
                option.dataset.condition = cond;
                
                cardSelect.appendChild(option);
            }
        });

        if (uniqueOptions.size > 0) {
            statusMsg.textContent = `Loaded ${uniqueOptions.size} card versions.`;
            statusMsg.className = 'status success';
        } else {
            statusMsg.textContent = 'No data found.';
            statusMsg.className = 'status error';
        }
    }

    // --- EVENT LISTENERS ---

    // 1. Card Selection Change
    cardSelect.addEventListener('change', (e) => {
        currentSelectedId = e.target.value;
        currentSelectedCondition = e.target.options[e.target.selectedIndex]?.dataset.condition;
        updateChart();
    });

    // 2. Time Filter Button Clicks
    filterButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            // Remove active class from all
            filterButtons.forEach(b => b.classList.remove('active'));
            // Add to clicked
            btn.classList.add('active');
            
            // Update state
            currentFilterDays = parseInt(btn.dataset.days);
            
            // Refresh chart
            updateChart();
        });
    });

    // --- INITIALIZATION SEQUENCE ---

    fetch(JSON_FILE)
        .then(res => res.ok ? res.json() : Promise.reject('JSON file not found'))
        .then(data => {
            cardMetadata = data;
            
            Papa.parse(CSV_FILE, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.errors.length > 0) console.warn("CSV Warnings:", results.errors.slice(0, 3));
                    
                    allPriceData = results.data;
                    
                    if (allPriceData.length === 0) {
                        statusMsg.textContent = 'Error: Price data is empty.';
                        statusMsg.className = 'status error';
                        return;
                    }

                    initChart();
                    populateDropdown();
                },
                error: function(err) {
                    statusMsg.textContent = 'Error loading price history.';
                    statusMsg.className = 'status error';
                    console.error(err);
                }
            });
        })
        .catch(err => {
            statusMsg.textContent = 'Error loading metadata.';
            statusMsg.className = 'status error';
            console.error(err);
        });

</script>

</body>
</html>
